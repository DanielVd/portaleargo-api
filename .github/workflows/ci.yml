name: CI

on:
  push:
    branches:
      - main
      - feat/modern-api
  pull_request:
    branches:
      - main

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: ESLint
        run: npx eslint src --max-warnings=0

      - name: TypeScript
        run: npx tsc --noEmit

      - name: E2E runner syntax
        run: node --check scripts/e2e-readonly.mjs

      - name: Build
        run: npm run build
