name: Famiglia read-only E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-readonly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run read-only E2E
        env:
          CODICE_SCUOLA: ${{ secrets.ARGO_SCHOOL_CODE }}
          NOME_UTENTE: ${{ secrets.ARGO_USERNAME }}
          PASSWORD: ${{ secrets.ARGO_PASSWORD }}
        run: node scripts/e2e-readonly.mjs
